name: medexpense
description: "Offline-first personal finance app for MBBS students in Belarus."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Background Sync
  workmanager: ^0.5.2

  # Networking
  http: ^1.2.1

  # Settings & Cached AI Summary
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

  # Typography
  google_fonts: ^6.2.1

  # UUID v4 primary keys (required by SCHEMA.md)
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

